<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>AI 智能机械零件报价系统 · 演示版</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>

  --bg:#0f151b; --panel:#161f28; --card:#1b2632; --card-2:#212e3c; --ink:#e9eef3; --dim:#93a4b1; --faint:#5f7180;

*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;line-height:1.7;font-size:14px}

#root{position:relative;z-index:1}
.topbar{position:sticky;top:0;z-index:50;background:rgba(15,21,27,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1180px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}

.sp{flex:1}
.btn-ghost{background:none;border:1px solid var(--line-2);color:var(--dim);font-size:12px;padding:6px 13px;border-radius:8px;cursor:pointer}

.banner i{color:var(--accent)}

.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl-wrap{border:1px solid var(--line);border-radius:14px;overflow:auto}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.1em;color:#0d1418;background:var(--steel);padding:11px 15px;white-space:nowrap;font-weight:700}
.tbl td{padding:12px 15px;border-top:1px solid var(--line);font-size:13.5px;vertical-align:middle}
.tbl tr.click{cursor:pointer;transition:background .2s}

.tagchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.04em}
.tagchip i{width:6px;height:6px;border-radius:50%}
.t-parse{background:var(--steel-soft);color:#7fb3d0}.t-parse i{background:#7fb3d0}
.t-review{background:rgba(232,179,75,.12);color:var(--warn)}.t-review i{background:var(--warn)}
.t-ok{background:rgba(62,207,142,.12);color:var(--ok)}.t-ok i{background:var(--ok)}
.t-probe{background:var(--accent-soft);color:var(--accent)}.t-probe i{background:var(--accent)}
.t-reject{background:rgba(239,106,90,.12);color:var(--danger)}.t-reject i{background:var(--danger)}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#14100b;border:none;font-weight:800;font-size:13.5px;padding:11px 22px;border-radius:10px;cursor:pointer;transition:all .2s;letter-spacing:.02em}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px}

.panel h3 i{color:var(--accent);width:17px;height:17px}
.probe-in label{display:block;font-size:12px;color:var(--dim);margin:12px 0 5px}
.probe-in select,.probe-in input{width:100%;background:var(--bg);border:1px solid var(--line-2);color:var(--ink);border-radius:9px;padding:10px 13px;font-size:14px;font-weight:600}
.range-card{margin-top:22px;background:linear-gradient(135deg,var(--card-2),var(--card));border:1px solid rgba(242,128,30,.45);border-radius:16px;padding:30px;text-align:center}
.range-card .rl{font-size:11px;letter-spacing:.22em;color:var(--dim)}
.range-card .rv{font-family:Georgia,serif;font-size:44px;font-weight:900;color:var(--accent);margin:8px 0}
.range-card .rn{font-size:12px;color:var(--warn)}
.schemes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.scheme{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;cursor:pointer;transition:all .25s;position:relative}
.scheme:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 16px 36px -16px rgba(0,0,0,.7)}
.scheme.sel{border-color:var(--accent);background:var(--card-2)}
.scheme.sel::after{content:"已选定";position:absolute;top:-11px;right:14px;background:var(--accent);color:#14100b;font-size:10.5px;font-weight:800;padding:3px 11px;border-radius:99px;letter-spacing:.1em}
.scheme .sl{font-size:11px;letter-spacing:.16em;color:var(--dim)}
.scheme h4{font-size:16px;font-weight:800;margin:4px 0 10px}
.scheme .pv{font-family:Georgia,serif;font-size:31px;font-weight:900;color:var(--accent)}
.scheme .ph{font-size:12px;color:var(--dim);margin:4px 0 10px}
.scheme .diff{font-size:12px;color:var(--dim);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px}
.cost-tbl td,.cost-tbl th{font-size:13px}
.cost-tbl input{background:var(--bg);border:1px solid var(--line-2);color:var(--accent);font-weight:800;border-radius:7px;padding:4px 8px;width:100px;font-size:13px;text-align:right}
.basis{font-size:11px;color:var(--faint);font-family:var(--mono)}
.total-bar{display:flex;align-items:center;justify-content:space-between;background:var(--card-2);border:1px solid var(--line-2);border-radius:12px;padding:14px 20px;margin-top:14px}
.total-bar .tl{font-size:12px;letter-spacing:.14em;color:var(--dim)}
.total-bar .tv{font-family:Georgia,serif;font-size:27px;font-weight:900;color:var(--accent)}
.assume{background:rgba(232,179,75,.08);border:1px solid rgba(232,179,75,.35);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.assume .ah{font-size:12.5px;font-weight:800;color:var(--warn);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.assume .ah i{width:15px;height:15px}
.assume .ar{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:13px}
.assume .ar:first-of-type{border-top:none}
.assume .ar b{color:var(--warn)}
.assume select{background:var(--bg);border:1px solid var(--line-2);color:var(--ink);border-radius:7px;padding:4px 8px;font-size:12.5px}
.paper{background:#fdfcf9;color:#1a2228;border-radius:6px;padding:44px 48px;max-width:820px;margin:0 auto;box-shadow:0 24px 60px -24px rgba(0,0,0,.8);font-family:Georgia,"Noto Serif SC","Songti SC",serif}
.paper h2{text-align:center;font-size:22px;letter-spacing:.14em;border-bottom:2px solid #1a2228;padding-bottom:12px}
.paper .meta-row{display:flex;justify-content:space-between;font-size:12px;color:#5a6570;margin:14px 0;padding-bottom:10px;border-bottom:1px dashed #c8c2b4;flex-wrap:wrap;gap:6px}
.paper table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px}
.paper th{border:1px solid #1a2228;padding:7px 9px;background:#eef0ea;font-size:11.5px;letter-spacing:.06em}
.paper td{border:1px solid #b9b3a4;padding:7px 9px}
.paper td.amt{text-align:right;font-weight:700}
.paper .grand{margin-top:16px;text-align:right;font-size:17px;font-weight:900}
.paper .basis2{font-size:10px;color:#8a8474;display:block;margin-top:2px}
.paper .note{margin-top:18px;font-size:11px;color:#6a6456}
.rates-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.rate-group{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px 18px}
.rate-group h4{font-size:13.5px;font-weight:800;display:flex;gap:8px;align-items:center;margin-bottom:10px}
.rate-group h4 i{width:15px;height:15px;color:var(--accent)}
.rate-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13px}
.rate-row:first-of-type{border-top:none}
.rate-row .rn{flex:1;color:var(--dim)}
.rate-row .rv{font-weight:800;font-family:var(--mono)}
.rate-row input{background:var(--bg);border:1px solid var(--line-2);color:var(--accent);font-weight:800;border-radius:7px;padding:4px 8px;width:110px;font-size:13px;text-align:right}
.rate-row .rs{font-size:10.5px;color:var(--faint)}
.searchbar{display:flex;gap:10px;margin-bottom:16px}
.searchbar input{flex:1;background:var(--card);border:1px solid var(--line-2);color:var(--ink);border-radius:10px;padding:11px 16px;font-size:13.5px}
.modal-bg{position:fixed;inset:0;background:rgba(6,10,14,.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:16px;padding:30px 34px;max-width:460px;width:100%}
.modal h3{font-size:17px;font-weight:800;margin-bottom:10px}
.modal p{color:var(--dim);font-size:13.5px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.toast{position:fixed;bottom:26px;right:26px;z-index:200;background:var(--card-2);border:1px solid var(--accent);border-radius:12px;padding:13px 20px;font-size:13.5px;box-shadow:0 14px 40px -12px rgba(0,0,0,.8);animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.empty{text-align:center;color:var(--dim);padding:50px 0;font-size:13.5px}
.detail-box{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin-top:14px}
.timeline{border-left:2px solid var(--line-2);margin:12px 0 0 10px;padding-left:18px}
.timeline .te{position:relative;padding:6px 0;font-size:12.5px;color:var(--dim)}
.timeline .te::before{content:"";position:absolute;left:-23.5px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.timeline .te b{color:var(--ink)}
.bignum{font-family:Georgia,serif;font-weight:900}
.foot{max-width:1180px;margin:0 auto;padding:20px 22px 34px;color:var(--faint);font-size:11px;letter-spacing:.18em;text-align:center;border-top:1px solid var(--line)}
@media print{
  body{background:#fff}
  .topbar,.foot,nav,.btn,.banner,.no-print{display:none !important}
  .wrap{max-width:100%;padding:0}
  .paper{box-shadow:none;border-radius:0;padding:10mm 6mm}
  body::before{display:none}

</style>

<body>
<div id="root"></div>
<div class="foot">AI 智能机械零件报价系统 V0.2 演示版 · 数据取自项目技术底座 · 演示数据仅存本机浏览器 · jixiangyi.cn</div>
<script>
/* ================= 数据与计算引擎（预置值全部来自技术底座） ================= */
const LS_KEY="opc-quote-demo-v1";
const MATERIALS={
  al6061:{name:"6061铝合金",density:2.70,price:28.5,toolRate:10,removal:25},
  al7075:{name:"7075铝合金",density:2.81,price:45,toolRate:14,removal:22},
  steel45:{name:"45钢",density:7.85,price:6.5,toolRate:18,removal:13.75},
  ss304:{name:"304不锈钢",density:7.93,price:18,toolRate:20,removal:12.5},
};
const GROUPS=[["材料库","box"],["设备费率","cog"],["工时规则","clock"],["刀具摊销","wrench"],["利润规则","percent"],["探价规则","search"]];
function seedRates(v){return{version:v,machineRate:80,laborRate:60,marginMM:2,setupMin:30,profit:0.20,probeBand:0.20,lossRate:0.05,prepH:0.5,holeMin:0.08};}
function seed(){
  return{
    rates:seedRates(1),
    tasks:[
      {id:"QT-20261120-003",part:"支架零件",mat:"ss304",status:"parse",qty:1,created:"11-20 15:12",amount:null,mode:null},
      {id:"QT-20261120-002",part:"带孔板 50x40x10",mat:"al6061",status:"review",qty:1,created:"11-20 14:36",amount:null,mode:null},
      {id:"QT-20261120-001",part:"立方块 40x30x20",mat:"steel45",status:"done",qty:1,created:"11-20 10:02",amount:216,mode:"正式"},
    ],
    probes:[{id:"TJ-20261120-001",part:"带孔板 50x40x10",low:180,high:270,created:"11-20 13:40"}],
    history:[
      {id:"QT-20261119-005",part:"法兰盘 120x8",mat:"steel45",mode:"正式",amount:342,status:"已确认",date:"11-19 17:21",actual:{hours:3.1,cost:371},mods:[{who:"戢祥毅",what:"工时费 288 改 310",when:"11-19 17:18"}]},
      {id:"QT-20261118-003",part:"轴套 30x45",mat:"al7075",mode:"正式",amount:198,status:"已确认",date:"11-18 16:44",actual:null,mods:[{who:"戢祥毅",what:"装夹费 45 改 60（异形装夹）",when:"11-18 16:40"}]},
      {id:"QT-20261118-001",part:"底板 200x90x12",mat:"ss304",mode:"正式",amount:926,status:"已确认",date:"11-18 09:31",actual:null,mods:[]},
    ],
    lastFile:null,
  };
}
let S=load();
function load(){let d;try{const r=localStorage.getItem(LS_KEY);d=r?JSON.parse(r):seed();}catch(e){d=seed();}
  if(!d.matOverrides)d.matOverrides={};if(!d.operatorName)d.operatorName="戢祥毅";return d;}
function save(){S.cur={sample:CUR.sample,matKey:CUR.matKey||null,qty:CUR.qty,scheme:CUR.scheme,calc:CUR.calc,quoteNo:CUR.quoteNo,real:CUR.real,fields:CUR.fields};localStorage.setItem(LS_KEY,JSON.stringify(S));}
function rates(){return S.rates;}

/* 计算引擎：纯函数，依据字符串全程可见 */
function calc(part,matKey,qty,scheme,r){
  r=r||rates();const m=M(matKey);qty=qty||1;
  const L=part.l+r.marginMM*2,W=part.w+r.marginMM*2,H=part.h+r.marginMM*2;
  const blankVol=L*W*H/1000;                       // cm3
  const matCost=blankVol*m.density/1000*m.price*1000/1000*(1+r.lossRate);
  let removal=m.removal,toolRate=m.toolRate,setupMin=r.setupMin;
  let diffNote="基准参数组";
  if(scheme==="B"){removal*=1.4;toolRate*=1.5;setupMin*=0.5;diffNote="一次装夹、高效刀路（去除率提升40%，刀具摊销上浮50%）";}
  if(scheme==="C"){diffNote="材料换为 45钢，密度/单价/刀具档联动重算";}
  const mat2=(scheme==="C")?M("steel45"):m;
  const rem2=(scheme==="C")?M("steel45").removal:removal;
  const tr2=(scheme==="C")?M("steel45").toolRate:toolRate;
  const removedVol=Math.max(blankVol-part.vol,0.5);
  const hours=r.prepH+removedVol/rem2/60+(part.holes||0)*r.holeMin;
  const machCost=hours*r.machineRate;
  const toolCost=hours*tr2;
  const setupCost=setupMin/60*r.laborRate;
  const matCost2=(scheme==="C")?(blankVol*mat2.density/1000*mat2.price*(1+r.lossRate)):matCost;
  const sub=matCost2+machCost+toolCost+setupCost;
  const profit=sub*r.profit;
  const total=(sub+profit)*qty;
  return{qty,blankVol,matCost:matCost2,machCost,toolCost,setupCost,other:0,profit,hours,total:Math.round(total),
    lines:[
      {k:"材料费",v:matCost2,basis:"毛坯 "+L+"x"+W+"x"+H+"mm = "+blankVol.toFixed(1)+"cm3，密度 "+((scheme==="C")?mat2.density:m.density)+"g/cm3，单价 "+((scheme==="C")?mat2.price:m.price)+"元/kg（市场参考价），损耗 "+(r.lossRate*100)+"%"},
      {k:"工时费",v:machCost,basis:hours.toFixed(2)+"h x "+r.machineRate+"元/h（三轴数控铣，市场参考价）；工时=准备"+r.prepH+"h+去除"+removedVol.toFixed(1)+"cm3/"+rem2.toFixed(1)+"cm3/min+孔附加工时"},
      {k:"刀具耗材",v:toolCost,basis:hours.toFixed(2)+"h x "+tr2+"元/h 摊销（独立核算，按材料分档）"},
      {k:"装夹准备",v:setupCost,basis:setupMin+"min x "+r.laborRate+"元/h 人工费率"},
      {k:"其他费用",v:0,basis:"本单无"},
      {k:"利润",v:profit,basis:"小计 x 利润率 "+(r.profit*100)+"%（可按难度上浮）"},
    ],diffNote};
}

const API_V1="/api/v1";
function api(path,opt){
  opt=opt||{};
  opt.headers=Object.assign({"X-Operator-Id":"demo"},opt.headers||{});
  // 线上经 Cloudflare 边缘转发，偶发 520 / 200-空响应（跨境冷启动）：自动重试，最多 3 次
  var attempt=0;
  function once(){
    attempt++;
    return fetch(API_V1+path,opt).then(function(r){
      return r.text().then(function(t){
        var d=null;try{d=JSON.parse(t);}catch(e){}
        if(!r.ok)throw new Error((d&&(d.error&&d.error.message||d.detail||d.error))||("HTTP "+r.status));
        if(d===null)throw new Error("EDGE_BAD_RESPONSE"); // 200 但内容不是 JSON = 边缘错误页
        return d;
      });
    }).catch(function(err){
      var msg=String((err&&err.message)||err||"");
      var retriable=msg==="EDGE_BAD_RESPONSE"||/Failed to fetch|NetworkError|Load failed|Network request failed|HTTP (520|522|524|523)/.test(msg);
      if(retriable&&attempt<3){
        return new Promise(function(res){setTimeout(res,700*attempt);}).then(once);
      }
      if(msg==="EDGE_BAD_RESPONSE")throw new Error("解析服务临时不可用（边缘抖动），请再试一次");
      throw err;
    });
  }
  return once();
}

        .catch(function(e2){ui.set(100,"解析失败："+e2.message);toast("解析失败："+e2.message);});

function applyReal(file,g,ann,feats,x){
  var mm3=g&&g.volume_mm3?parseFloat(g.volume_mm3):0;
  var holes=(feats||[]).length;
  var tech=(ann||[]).filter(function(a){return a&&a.field_value;}).slice(0,3).map(function(a){return a.field_value;}).join("；");
  var real={label:file.name,mat:"al6061",hash:String(x.up.sha256).slice(0,10)+"…",techReq:tech||"（图纸未提取到技术要求）",
    source:(g&&g.parser_name==="ocp")?"STEP计算":"OCR/AI提取",
    part:{l:g?parseFloat(g.length_mm):0,w:g?parseFloat(g.width_mm):0,h:g?parseFloat(g.height_mm):0,vol:mm3?mm3/1000:0,holes:holes,unit:(g&&g.unit)||"mm"},
    taskId:x.task.id,backend:true};
  if(!real.part.vol&&ann&&ann.length){
    var dim=ann.find(function(a){return /尺寸|长|宽|高|外形/.test(a.field_name||"");});
    if(dim&&dim.field_value){var nums=String(dim.field_value).match(/\d+(\.\d+)?/g)||[];if(nums.length>=3){real.part.l=+nums[0];real.part.w=+nums[1];real.part.h=+nums[2];real.part.vol=real.part.l*real.part.w*real.part.h*0.45;}}
  }
  real.fields=buildFields(real);
  CUR.sample=null;CUR.real=real;CUR.calc=null;CUR.fields=real.fields;
  S.lastFile={part:real.label,hash:real.hash};save();
}
function buildFields(real){
  var p=real.part;
  return [
    {k:"材料",v:MATERIALS[real.mat].name,src:"AI推测",conf:"低",assume:true,opts:Object.values(MATERIALS).map(function(x){return x.name;})},
    {k:"包络尺寸",v:p.l+" x "+p.w+" x "+p.h+" mm",src:real.source,conf:"确定",assume:false},
    {k:"体积",v:(p.vol||0).toFixed(1)+" cm3",src:real.source,conf:"确定",assume:false},
    {k:"单位",v:p.unit||"mm",src:real.source,conf:"确定",assume:false},
    {k:"技术要求",v:real.techReq,src:real.source,conf:"中",assume:false},
    {k:"数量",v:"1",src:"人工",conf:"确定",assume:false}
  ];

function clientParse(file){
  return file.text().then(function(txt){
    var pts=txt.match(/CARTESIAN_POINT\s*\(\s*'[^']*'\s*,\s*\(\s*(-?[\d.Ee+]+)\s*,\s*(-?[\d.Ee+]+)\s*,\s*(-?[\d.Ee+]+)/g)||[];
    if(!pts.length)throw new Error("没读到坐标点，可能不是 STEP 文本");
    var mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
    pts.forEach(function(t){var m=t.match(/\(\s*(-?[\d.Ee+]+)\s*,\s*(-?[\d.Ee+]+)\s*,\s*(-?[\d.Ee+]+)\s*\)$/);if(!m)return;for(var i=0;i<3;i++){var v=parseFloat(m[i+1]);if(v<mn[i])mn[i]=v;if(v>mx[i])mx[i]=v;}});
    var scale=/INCH/i.test(txt)?25.4:1;
    var l=(mx[0]-mn[0])*scale,w=(mx[1]-mn[1])*scale,hh=(mx[2]-mn[2])*scale;
    var holes=(txt.match(/CYLINDRICAL_SURFACE/g)||[]).length;
    var bbox=l*w*hh;
    var real={label:file.name,mat:"al6061",hash:"前端估算",techReq:"（未接后端，技术要求未提取）",source:"前端估算",
      part:{l:+l.toFixed(2),w:+w.toFixed(2),h:+hh.toFixed(2),vol:+(bbox*0.45/1000).toFixed(2),holes:holes,unit:"mm"},backend:false};
    real.fields=buildFields(real);return real;
  });
}

    d.innerHTML=`<h3 style="font-size:16px;font-weight:800">${x.id} · ${x.part} <span class="basis">${MATERIALS[x.mat]?MATERIALS[x.mat].name:(M(x.mat)?M(x.mat).name:"")}</span></h3>
      <div class="basis" style="margin-top:6px">核算口径：参数版本 v${x.ratesVersion!=null?x.ratesVersion:"未记录（旧单）"}${x.formulaVersion?" · 公式 "+x.formulaVersion:""}</div>`;
    const acts=h("div");acts.style.cssText="display:flex;gap:10px;margin:12px 0;flex-wrap:wrap";
    const b1=h("button","btn sm steel","复制为新报价");b1.title="只复制背景，零件信息清空，需重新上传/选样本，避免带入错零件";
    b1.onclick=()=>{CUR.real=null;CUR.sample=null;CUR.matKey=null;CUR.fields=null;CUR.calc=null;CUR.qty=1;S.lastFile=null;save();location.hash="#/upload";toast("已清空旧零件信息：请重新选样本或上传图纸后再报价");};
    acts.appendChild(b1);
    if(x.status==="已确认"&&x.ts&&Date.now()-x.ts<24*3600*1000){
      const bw=h("button","btn sm ghost","撤回（24h 内）");
      bw.onclick=()=>{x.status="已撤回";(x.mods=x.mods||[]).unshift({who:S.operatorName,what:"确认后撤回，留痕退回待审核",when:"刚刚"});save();toast("已撤回：历史留痕，可重新报价生成新版本");drawList();};
      acts.appendChild(bw);
    }else if(x.status==="已确认"){
      const bw=h("button","btn sm ghost","撤回（已过 24h 时限）");bw.disabled=true;bw.title="确认超过 24 小时不可撤回，走「复制为新报价」重新报价";acts.appendChild(bw);
    }
    d.appendChild(acts);
    const tl=h("div","timeline");
    (x.mods||[]).forEach(m=>tl.appendChild(h("div","te","<b>"+m.who+"</b> 修改："+m.what+" · "+m.when)));
    if(!x.mods||!x.mods.length)tl.appendChild(h("div","te","无修改记录（首次生成即确认）"));
    d.appendChild(tl);
    if(x.actual){d.innerHTML+=`<div class="assume" style="margin-top:14px"><div class="ah">${icon("check-circle")}已补录实际成本</div>
      <div class="ar">实际工时 <b>${x.actual.hours} h</b> · 实际成本 <b>${x.actual.cost} 元</b>（预估 ${x.amount} 元）—— 差异将用于费率校准（人工采纳）</div></div>`;}
    else{
      const f=h("div","probe-in");f.style.marginTop="14px";
      f.innerHTML=`<label>补录实际工时（h）</label><input id="h-act" value=""><label>补录实际成本（元）</label><input id="c-act" value="">`;
      const b=h("button","btn sm","保存补录");b.style.marginTop="12px";
      b.onclick=()=>{x.actual={hours:parseFloat($("#h-act").value)||0,cost:parseFloat($("#c-act").value)||0};save();toast("已补录：数据将反哺费率校准（人工采纳制）");drawDetail();};
      f.appendChild(b);d.appendChild(f);
    }
    listBox.appendChild(d);lucide.createIcons();
  }
  drawList();
}

<script>
(function () {
  var KEY = "opc-qa-v1";
  var open = false, busy = false, hist = [];

  var HTML_BALL =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M12 3a7 7 0 0 0-7 7v4l-2 3h11a7 7 0 0 0 7-7 7 7 0 0 0-7-7Z" opacity=".9"/>' +
    '<path d="M9.2 16.5c.9 1.9 3.4 2.6 5.3 1.7"/><circle cx="9" cy="9.6" r=".9" fill="currentColor" stroke="none"/>' +
    '<circle cx="15" cy="9.6" r=".9" fill="currentColor" stroke="none"/></svg>';

  var CHIPS = {
    dashboard: ["这个页面怎么用？", "探价和正式报价的区别", "费率表在哪改"],
    upload: ["支持什么图纸文件？", "材料为什么标待核？", "改完材料价格为什么没变"],
    probe: ["探价怎么填最快？", "区间是怎么算的", "探价记录存在哪"],
    compare: ["A、B、C 三档差在哪？", "选哪一档更稳妥", "怎么进终审"],
    review: ["终审我要做什么？", "改价后要重新算吗", "驳回会怎样"],
    quote: ["怎么导成 PDF？", "客户要明细给不给", "报价单存到哪"],
    rates: ["哪些参数能改？", "改完历史单会变吗", "材料单价在哪改"],
    history: ["怎么复制旧单？", "实际成本怎么补录", "为什么不能改旧单"]
  };

  var FAQ = [
    ["探价|区间|多少|报价", "探价三步：1) 顶部进「探价模式」；2) 确认材料类别、包络尺寸、数量三项（已预填）；3) 点「快速算价」，出正负 20% 区间。区间不含底价与成本明细，适合先给客户一个范围；要正式报价就点「转正式报价」进多方案。"],
    ["材料|待核|45钢|铝", "解析页的材料是 AI 推测项，标「待核」时点下拉选实际材料即可。确认后多方案、终审、报价单全部按确认的材料重算，材料价取费率表里的值——AI 只读图，不猜价格。"],
    ["终审|审核|闸门|改价", "终审是唯一人工闸门：上方核对假设项，下方逐行改价（材料/工时/刀具/装夹/其他五行可改），合计会实时重算，没问题点「确认报价」转正式价；不对就点「驳回重算」并填写原因。"],
    ["费率|参数|版本|单价", "费率表在顶部导航「费率表」：核心 8 个参数（设备费率、人工费率、余量、准备工时、孔附加、利润率、探价宽度、损耗率）可直接改；下方材料 4 类的单价 / 刀具摊销 / 去除率也开放编辑（共 12 项）。保存生成新版本，历史报价不回溯。"],
    ["驳回", "驳回：在终审页点「驳回重算」，填原因后确认，任务会转成「已驳回」并留痕；之后从任务台点该任务可回到多方案重新改价。"],
    ["上传|图纸|STEP|PDF|文件", "演示版不支持真实上传，只能用页面上的三个预置样本说明流程；正式版才接 STEP 几何解析和图片/PDF 的 AI 提取，每项都会标来源与置信度。"],
    ["报价单|导出|打印|PDF", "报价单页点「打印导出」用浏览器打印，目标选「另存为 PDF」就是 PDF；每行都带计算依据。点「存入历史」会写进历史报价，不可覆盖。"],
    ["历史|补录|复制|旧单", "历史报价不可覆盖：点某一行看详情与修改时间线，可「复制为新报价」重新算，也可补录实际工时和实际成本，用来校准费率。"],
    ["数量|批量|几件", "解析结果里的「数量」一栏直接改（整数且 ≥1）；探价、多方案、终审、报价单都按件数算总价。"],
    ["客户|交期|有效期", "报价单里客户名先留空手填，有效期默认 15 天；演示版不承诺交期，这是有意的。"],
    ["多方案|A|B|C|方案", "A 是常规加工基准；B 优化工艺（一次装夹、去除率提升 40%、刀具摊销上浮 50%，工时更短）；C 是把材料换成 45 钢联动重算。三档都按本厂费率实时算，选定一档再进终审。"]
  ];

  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    return e;
  }

  function pageKey() {
    var h = (location.hash || "#/dashboard").replace("#/", "").split("/")[0];
    return CHIPS[h] ? h : "dashboard";
  }
  function pageName() {
    var h1 = document.querySelector(".page-head h1");
    return h1 ? h1.innerText.trim() : "任务台";
  }
  function pageState() {
    var t = document.querySelector("#ct-total");
    if (t) return "终审合计 " + t.innerText.trim();
    var s = document.querySelector(".scheme .pv");
    if (s && document.querySelector(".schemes")) return "当前方案合计 " + s.innerText.trim();
    return "";
  }

  // ---------- DOM ----------
  var ball = el("button", "qa-ball");
  ball.type = "button";
  ball.setAttribute("aria-label", "打开报价助手");
  ball.innerHTML = HTML_BALL + '<span class="qa-dot"></span>';

  var nudge = el("div", "qa-nudge", "<b>不会用？</b>点右边小球问我，讲清这个页面怎么操作。");

  var panel = el("div", "qa-panel");
  panel.setAttribute("role", "dialog");
  panel.setAttribute("aria-label", "报价助手");
  panel.innerHTML =
    '<div class="qa-head">' +
    '<div class="qa-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5Z"/><path d="M8.5 9h7M8.5 12h4"/></svg></div>' +
    '<div><div class="qa-t">报价助手</div><div class="qa-s">智谱 GLM · 项目问答 · 操作带做</div></div>' +
    '<button class="qa-x" type="button" aria-label="关闭">×</button></div>' +
    '<div class="qa-body" id="qaBody"></div>' +
    '<div class="qa-chips" id="qaChips"></div>' +
    '<form class="qa-form"><input class="qa-in" id="qaIn" maxlength="200" placeholder="问：这个页面怎么用？" autocomplete="off"><button class="qa-send" type="submit">发送</button></form>';

  document.addEventListener("DOMContentLoaded", mount);
  if (document.readyState !== "loading") mount();
  function mount() {
    if (document.querySelector(".qa-ball")) return;
    document.body.appendChild(ball);
    document.body.appendChild(nudge);
    document.body.appendChild(panel);
    bind();
    restore();
    setTimeout(function () {
      if (!open && !sessionStorage.getItem(KEY + "-nudged")) {
        nudge.classList.add("on");
        sessionStorage.setItem(KEY + "-nudged", "1");
        setTimeout(function () { nudge.classList.remove("on"); }, 9000);
      }
    }, 5200);
  }

  var body, chips, input;
  function bind() {
    body = panel.querySelector("#qaBody");
    chips = panel.querySelector("#qaChips");
    input = panel.querySelector("#qaIn");
    ball.onclick = function () { open ? close() : show(); };
    nudge.onclick = show;
    panel.querySelector(".qa-x").onclick = close;
    panel.querySelector(".qa-form").onsubmit = function (e) {
      e.preventDefault();
      var q = (input.value || "").trim();
      if (!q || busy) return;
      input.value = "";
      ask(q);
    };
    document.addEventListener("keydown", function (e) { if (e.key === "Escape" && open) close(); });
    window.addEventListener("hashchange", function () { if (open) renderChips(); });
  }

  function show() {
    open = true; panel.classList.add("on"); nudge.classList.remove("on");
    renderChips();
    if (!hist.length) greet();
    setTimeout(function () { input.focus(); }, 120);
  }
  function close() { open = false; panel.classList.remove("on"); }

  function renderChips() {
    chips.innerHTML = "";
    (CHIPS[pageKey()] || CHIPS.dashboard).forEach(function (t) {
      var c = el("button", "qa-chip", t);
      c.type = "button";
      c.onclick = function () { ask(t); };
      chips.appendChild(c);
    });
  }

  function add(role, text, cls) {
    var m = el("div", "qa-msg " + (cls || role), text);
    body.appendChild(m);
    body.scrollTop = body.scrollHeight;
    return m;
  }

  function greet() {
    add("bot", "我是这个项目的站内助手：页面怎么用、这个项目怎么做的、报价怎么算，都可以问。\n当前你在「" + pageName() + "」，可以直接点下面的问题，也可以自己打字。");
    save();
  }

  function save() {
    try {
      hist = Array.prototype.slice.call(body.querySelectorAll(".qa-msg.bot,.qa-msg.me")).map(function (m) {
        return { role: m.classList.contains("me") ? "user" : "assistant", content: m.innerText };
      }).slice(-12);
      sessionStorage.setItem(KEY, JSON.stringify(hist));
    } catch (e) {}
  }
  function restore() {
    try {
      var raw = sessionStorage.getItem(KEY);
      if (!raw) return;
      hist = JSON.parse(raw) || [];
      if (open) return;
      hist.forEach(function (m) { add(m.role === "user" ? "me" : "bot", m.content); });
    } catch (e) {}
  }

  function ask(q) {
    if (busy) return;
    busy = true;
    panel.dataset.busy = "1";
    add("me", q);
    var tip = el("div", "qa-typing", "<i></i><i></i><i></i>");
    body.appendChild(tip);
    body.scrollTop = body.scrollHeight;
    var msgs = hist.slice(-6).concat([{ role: "user", content: q }]);
    callApi(msgs).then(function (reply) {
      tip.remove();
      typeOut(reply);
    }).catch(function (err) {
      tip.remove();
      var a = localAnswer(q);
      add("tip", "（后端未连通，先用离线说明）");
      typeOut(a);
    }).then(function () {
      busy = false;
      panel.dataset.busy = "";
    });
  }

  function callApi(msgs) {
    return fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: msgs, context: { page: pageName(), note: pageState() } })
    }).then(function (r) {
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (d) {
        throw new Error((d && d.error) || ("HTTP " + r.status));
      });
      return r.json();
    }).then(function (d) {
      if (!d || !d.reply) throw new Error("空回答");
      return d.reply;
    });
  }

  function typeOut(text) {
    var m = add("bot", "");
    var i = 0;
    var t = setInterval(function () {
      i += Math.max(2, Math.round(text.length / 60));
      m.innerText = text.slice(0, i);
      body.scrollTop = body.scrollHeight;
      if (i >= text.length) { clearInterval(t); m.innerText = text; save(); }
    }, 22);
  }

  var HOWTO = {
    dashboard: "任务台三步：1 上方三个数字卡看量（报价任务、已确认报价、探价记录）；2 点「新建报价」开一单，或点「快速探价」先给区间；3 表格点行看任务。这里只做分派，不算价。",
    upload: "上传解析三步：1 拖入 STEP / 图片 / PDF，或点预置样本；2 等解析出 7 项结果，材料标「AI推测·待核」，点下拉改成实际材料（确认后全链路重算）；3 底部点「去报价」进多方案。未连后端时自动走前端估算并明确标注。",
    probe: "探价三步：1 材料类别保持预填；2 包络尺寸按 长 x 宽 x 高 改，中间用英文小写 x；3 填数量点「快速算价」。出正负 20% 区间，不含底价与明细。",
    compare: "多方案三步：1 点 A、B、C 三张卡切换看合计（A 常规、B 优化工艺、C 换 45钢）；2 看下方六项成本与依据；3 点「选定方案 X，去终审」。",
    review: "终审三步：1 先看上方假设项是不是都确认过；2 下方前五行金额可直接改，合计实时重算；3 没问题点「确认报价，生成报价单」，不对就点「驳回重算」写原因。",
    quote: "报价单三步：1 核对编号、零件、材料、数量与六行依据；2 点「打印导出」，打印目标选另存为 PDF；3 点「存入历史」留档，历史不可覆盖。",
    rates: "费率表三步：1 上半「核心参数」8 项直接改（设备费率、人工费率、余量、准备工时、孔附加、利润率、探价宽度、损耗率）；2 点「保存为新版本」；3 历史报价不回溯。下方材料 4 类的单价 / 刀具摊销 / 去除率也可改，保存同样生成新版本。",
    history: "历史报价三步：1 用搜索框按编号或零件名过滤；2 点一行看修改时间线；3 可「复制为新报价」或补录实际工时与实际成本。"
  };
  function localAnswer(q) {
    if (/怎么用|使用|不会|上手|入门|操作/.test(q)) return HOWTO[pageKey()] || HOWTO.dashboard;
    for (var i = 0; i < FAQ.length; i++) {
      var re = new RegExp(FAQ[i][0]);
      if (re.test(q)) return FAQ[i][1];
    }
    return "这一项我不确定。演示版能讲清的是：任务台看任务、上传解析看识别结果、探价出区间、多方案比 A/B/C、终审改价确认、报价单导出、费率表改参数、历史报价查旧单。你问的具体是哪一页？";
  }

  window.__qa = { ask: ask, open: show, close: close, page: pageName };
})();
</script>
</body>
</html>
