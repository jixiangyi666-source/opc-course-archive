<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OPC 08 · M8 档案生成 | 无障碍智慧出行服务</title>
<style>
:root{
  --bg:#f5f3ee; --card:#fff; --ink:#182225; --dim:#5c6d72; --faint:#8b98a5;
  --accent:#0d6a7c; --accent-2:#d97b3f; --line:rgba(24,34,37,.10);
  --shadow:0 1px 2px rgba(24,34,37,.04),0 16px 44px rgba(24,34,37,.10);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;line-height:1.85;min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 14% 6%,rgba(13,106,124,.07),transparent 42%),radial-gradient(circle at 86% 16%,rgba(217,123,63,.06),transparent 44%)}
.box{position:relative;max-width:600px;width:calc(100% - 48px);margin:24px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:54px 50px 44px;text-align:center;box-shadow:var(--shadow)}
.no{font-family:Georgia,serif;font-size:76px;font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(13,106,124,.65)}
h1{font-size:27px;font-weight:900;margin:20px 0 4px;letter-spacing:-.01em}
.sub{font-size:13px;color:var(--faint);letter-spacing:.2em;margin-bottom:14px}
p{color:var(--dim);font-size:14.5px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:7px;margin-top:24px;font-size:12px;font-weight:700;color:#8a6d1f;background:rgba(217,123,63,.08);border:1px solid rgba(217,123,63,.3);border-radius:999px;padding:6px 18px}
.tag i{width:6px;height:6px;border-radius:50%;background:#d97b3f;animation:pulse 2.2s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,123,63,.4)}50%{box-shadow:0 0 0 6px rgba(217,123,63,0)}}
.progress{margin-top:30px;display:flex;justify-content:center;gap:6px}
.progress span{width:26px;height:4px;border-radius:99px;background:rgba(24,34,37,.1)}
.progress span.on{background:var(--accent)}
a.back{display:inline-block;margin-top:30px;font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:8px 20px;transition:border-color .3s}
a.back:hover{border-color:var(--accent)}
.foot{margin-top:26px;font-size:10.5px;color:var(--faint);letter-spacing:.2em}
</style></head>
<body><div class="box">
<div class="no">08</div>
<h1>M8 档案生成</h1>
<div class="sub">OPC · JIXIANGYI.CN</div>
<p>项目档案 · 时间线 · 方法复盘 · 4F 反思<br>模块完成后，全过程 HTML 档案将在本页上线。</p>
<div class="tag"><i></i>模块进行中 · 敬请期待</div>
<div class="progress"><span class="on"></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<a class="back" href="https://www.jixiangyi.cn">← 返回课程档案主页</a>
<div class="foot">JIIXIANGYI.CN · OPC COURSE ARCHIVE · 2026</div>
</div></body></html>
