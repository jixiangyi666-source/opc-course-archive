<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>AI 智能机械零件报价系统 · 演示版</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>

  --bg:#0f151b; --panel:#161f28; --card:#1b2632; --card-2:#212e3c; --ink:#e9eef3; --dim:#93a4b1; --faint:#5f7180;

.sp{flex:1}

.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl-wrap{border:1px solid var(--line);border-radius:14px;overflow:auto}
.tbl th{text-align:left;font-size:11.5px;letter-spacing:.1em;color:#0d1418;background:var(--steel);padding:11px 15px;white-space:nowrap;font-weight:700}
.tbl td{padding:12px 15px;border-top:1px solid var(--line);font-size:13.5px;vertical-align:middle}

.tagchip{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:99px;letter-spacing:.04em}
.tagchip i{width:6px;height:6px;border-radius:50%}
.t-parse{background:var(--steel-soft);color:#7fb3d0}.t-parse i{background:#7fb3d0}
.t-review{background:rgba(232,179,75,.12);color:var(--warn)}.t-review i{background:var(--warn)}

.range-card{margin-top:22px;background:linear-gradient(135deg,var(--card-2),var(--card));border:1px solid rgba(242,128,30,.45);border-radius:16px;padding:30px;text-align:center}
.range-card .rl{font-size:11px;letter-spacing:.22em;color:var(--dim)}
.range-card .rv{font-family:Georgia,serif;font-size:44px;font-weight:900;color:var(--accent);margin:8px 0}
.range-card .rn{font-size:12px;color:var(--warn)}
.schemes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}

.scheme:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:0 16px 36px -16px rgba(0,0,0,.7)}

.scheme .pv{font-family:Georgia,serif;font-size:31px;font-weight:900;color:var(--accent)}

.basis{font-size:11px;color:var(--faint);font-family:var(--mono)}
.total-bar{display:flex;align-items:center;justify-content:space-between;background:var(--card-2);border:1px solid var(--line-2);border-radius:12px;padding:14px 20px;margin-top:14px}
.total-bar .tl{font-size:12px;letter-spacing:.14em;color:var(--dim)}
.total-bar .tv{font-family:Georgia,serif;font-size:27px;font-weight:900;color:var(--accent)}
.assume{background:rgba(232,179,75,.08);border:1px solid rgba(232,179,75,.35);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.assume .ah{font-size:12.5px;font-weight:800;color:var(--warn);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.assume .ah i{width:15px;height:15px}
.assume .ar{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px dashed var(--line);font-size:13px}
.assume .ar:first-of-type{border-top:none}

.paper h2{text-align:center;font-size:22px;letter-spacing:.14em;border-bottom:2px solid #1a2228;padding-bottom:12px}
.paper .meta-row{display:flex;justify-content:space-between;font-size:12px;color:#5a6570;margin:14px 0;padding-bottom:10px;border-bottom:1px dashed #c8c2b4;flex-wrap:wrap;gap:6px}
.paper table{width:100%;border-collapse:collapse;margin-top:14px;font-size:12.5px}
.paper th{border:1px solid #1a2228;padding:7px 9px;background:#eef0ea;font-size:11.5px;letter-spacing:.06em}

.paper td.amt{text-align:right;font-weight:700}
.paper .grand{margin-top:16px;text-align:right;font-size:17px;font-weight:900}
.paper .basis2{font-size:10px;color:#8a8474;display:block;margin-top:2px}
.paper .note{margin-top:18px;font-size:11px;color:#6a6456}
.rates-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:14px}
.rate-group{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:17px 18px}
.rate-group h4{font-size:13.5px;font-weight:800;display:flex;gap:8px;align-items:center;margin-bottom:10px}
.rate-group h4 i{width:15px;height:15px;color:var(--accent)}
.rate-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:13px}
.rate-row:first-of-type{border-top:none}
.rate-row .rn{flex:1;color:var(--dim)}
.rate-row .rv{font-weight:800;font-family:var(--mono)}
.rate-row input{background:var(--bg);border:1px solid var(--line-2);color:var(--accent);font-weight:800;border-radius:7px;padding:4px 8px;width:110px;font-size:13px;text-align:right}
.rate-row .rs{font-size:10.5px;color:var(--faint)}
.searchbar{display:flex;gap:10px;margin-bottom:16px}
.searchbar input{flex:1;background:var(--card);border:1px solid var(--line-2);color:var(--ink);border-radius:10px;padding:11px 16px;font-size:13.5px}
.modal-bg{position:fixed;inset:0;background:rgba(6,10,14,.7);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:16px;padding:30px 34px;max-width:460px;width:100%}
.modal h3{font-size:17px;font-weight:800;margin-bottom:10px}
.modal p{color:var(--dim);font-size:13.5px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;margin-top:22px}
.toast{position:fixed;bottom:26px;right:26px;z-index:200;background:var(--card-2);border:1px solid var(--accent);border-radius:12px;padding:13px 20px;font-size:13.5px;box-shadow:0 14px 40px -12px rgba(0,0,0,.8);animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.empty{text-align:center;color:var(--dim);padding:50px 0;font-size:13.5px}
.detail-box{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:18px 20px;margin-top:14px}
.timeline{border-left:2px solid var(--line-2);margin:12px 0 0 10px;padding-left:18px}
.timeline .te{position:relative;padding:6px 0;font-size:12.5px;color:var(--dim)}
.timeline .te::before{content:"";position:absolute;left:-23.5px;top:13px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.timeline .te b{color:var(--ink)}
.bignum{font-family:Georgia,serif;font-weight:900}
.foot{max-width:1180px;margin:0 auto;padding:20px 22px 34px;color:var(--faint);font-size:11px;letter-spacing:.18em;text-align:center;border-top:1px solid var(--line)}
@media print{
  body{background:#fff}
  .topbar,.foot,nav,.btn,.banner,.no-print{display:none !important}
  .wrap{max-width:100%;padding:0}
  .paper{box-shadow:none;border-radius:0;padding:10mm 6mm}
  body::before{display:none}

<body>
<div id="root"></div>
<div class="foot">AI 智能机械零件报价系统 V0.1 演示版 · 数据取自项目技术底座 · jixiangyi.cn</div>
<script>
/* ================= 数据与计算引擎（预置值全部来自技术底座） ================= */
const LS_KEY="opc-quote-demo-v1";
const MATERIALS={
  al6061:{name:"6061铝合金",density:2.70,price:28.5,toolRate:10,removal:25},
  al7075:{name:"7075铝合金",density:2.81,price:45,toolRate:14,removal:22},
  steel45:{name:"45钢",density:7.85,price:6.5,toolRate:18,removal:13.75},
  ss304:{name:"304不锈钢",density:7.93,price:18,toolRate:20,removal:12.5},
};
const GROUPS=[["材料库","box"],["设备费率","cog"],["工时规则","clock"],["刀具摊销","wrench"],["利润规则","percent"],["探价规则","search"]];
function seedRates(v){return{version:v,machineRate:80,laborRate:60,marginMM:2,setupMin:30,profit:0.20,probeBand:0.20,lossRate:0.05,prepH:0.5,holeMin:0.08};}
function seed(){
  return{
    rates:seedRates(1),
    tasks:[
      {id:"QT-20261120-003",part:"支架零件",mat:"ss304",status:"parse",qty:1,created:"11-20 15:12",amount:null,mode:null},
      {id:"QT-20261120-002",part:"带孔板 50x40x10",mat:"al6061",status:"review",qty:1,created:"11-20 14:36",amount:null,mode:null},
      {id:"QT-20261120-001",part:"立方块 40x30x20",mat:"steel45",status:"done",qty:1,created:"11-20 10:02",amount:216,mode:"正式"},
    ],
    probes:[{id:"TJ-20261120-001",part:"带孔板 50x40x10",low:180,high:270,created:"11-20 13:40"}],
    history:[
      {id:"QT-20261119-005",part:"法兰盘 120x8",mat:"steel45",mode:"正式",amount:342,status:"已确认",date:"11-19 17:21",actual:{hours:3.1,cost:371},mods:[{who:"戢祥毅",what:"工时费 288 改 310",when:"11-19 17:18"}]},
      {id:"QT-20261118-003",part:"轴套 30x45",mat:"al7075",mode:"正式",amount:198,status:"已确认",date:"11-18 16:44",actual:null,mods:[{who:"戢祥毅",what:"装夹费 45 改 60（异形装夹）",when:"11-18 16:40"}]},
      {id:"QT-20261118-001",part:"底板 200x90x12",mat:"ss304",mode:"正式",amount:926,status:"已确认",date:"11-18 09:31",actual:null,mods:[]},
    ],
    lastFile:null,
  };
}
let S=load();
function load(){try{const r=localStorage.getItem(LS_KEY);return r?JSON.parse(r):seed();}catch(e){return seed();}}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(S));}
function rates(){return S.rates;}

/* 计算引擎：纯函数，依据字符串全程可见 */
function calc(part,matKey,qty,scheme,r){
  r=r||rates();const m=MATERIALS[matKey];qty=qty||1;
  const L=part.l+r.marginMM*2,W=part.w+r.marginMM*2,H=part.h+r.marginMM*2;
  const blankVol=L*W*H/1000;                       // cm3
  const matCost=blankVol*m.density/1000*m.price*1000/1000*(1+r.lossRate);
  let removal=m.removal,toolRate=m.toolRate,setupMin=r.setupMin;
  let diffNote="基准参数组";
  if(scheme==="B"){removal*=1.4;toolRate*=1.5;setupMin*=0.5;diffNote="一次装夹、高效刀路（去除率提升40%，刀具摊销上浮50%）";}
  if(scheme==="C"){diffNote="材料换为 45钢，密度/单价/刀具档联动重算";}
  const mat2=(scheme==="C")?MATERIALS.steel45:m;
  const rem2=(scheme==="C")?MATERIALS.steel45.removal:removal;
  const tr2=(scheme==="C")?MATERIALS.steel45.toolRate:toolRate;
  const removedVol=Math.max(blankVol-part.vol,0.5);
  const hours=r.prepH+removedVol/rem2/60+(part.holes||0)*r.holeMin;
  const machCost=hours*r.machineRate;
  const toolCost=hours*tr2;
  const setupCost=setupMin/60*r.laborRate;
  const matCost2=(scheme==="C")?(blankVol*mat2.density/1000*mat2.price*(1+r.lossRate)):matCost;
  const sub=matCost2+machCost+toolCost+setupCost;
  const profit=sub*r.profit;
  const total=(sub+profit)*qty;
  return{qty,blankVol,matCost:matCost2,machCost,toolCost,setupCost,other:0,profit,hours,total:Math.round(total),
    lines:[
      {k:"材料费",v:matCost2,basis:"毛坯 "+L+"x"+W+"x"+H+"mm = "+blankVol.toFixed(1)+"cm3，密度 "+((scheme==="C")?mat2.density:m.density)+"g/cm3，单价 "+((scheme==="C")?mat2.price:m.price)+"元/kg（市场参考价），损耗 "+(r.lossRate*100)+"%"},
      {k:"工时费",v:machCost,basis:hours.toFixed(2)+"h x "+r.machineRate+"元/h（三轴数控铣，市场参考价）；工时=准备"+r.prepH+"h+去除"+removedVol.toFixed(1)+"cm3/"+rem2.toFixed(1)+"cm3/min+孔"+(part.holes||0)+"x"+r.holeMin+"h"},
      {k:"刀具耗材",v:toolCost,basis:hours.toFixed(2)+"h x "+tr2+"元/h 摊销（独立核算，按材料分档）"},
      {k:"装夹准备",v:setupCost,basis:setupMin+"min x "+r.laborRate+"元/h 人工费率"},
      {k:"其他费用",v:0,basis:"本单无"},
      {k:"利润",v:profit,basis:"小计 x 利润率 "+(r.profit*100)+"%（可按难度上浮）"},
    ],diffNote};
}
const SAMPLES={
  plate:{part:{l:50,w:40,h:10,vol:19.2,holes:8,unit:"mm"},label:"带孔板 50x40x10",mat:"al6061",hash:"b37811bc…84add4",techReq:"去毛刺、孔口倒角 C0.5"},
  block:{part:{l:40,w:30,h:20,vol:22.5,holes:0,unit:"mm"},label:"立方块 40x30x20",mat:"steel45",hash:"ac05f87f…5429c0",techReq:"表面 Ra3.2"},

  <div class="note">备注：本报价依据企业自有费率表（参数版本 v${rates().version}）逐项核算，同输入同参数重算结果一致。材料单价标注"市场参考价"者以实际采购价为准。探价类咨询仅提供价格区间，不含底价与明细。</div>`;
  w.appendChild(paper);
  const acts=h("div");acts.style.cssText="display:flex;gap:10px;margin-top:18px;justify-content:center";
  const b1=h("button","btn","打印导出 "+icon("printer"));b1.onclick=()=>window.print();
  const b2=h("button","btn steel","存入历史 "+icon("save"));
  b2.onclick=()=>{if(!S.history.find(x=>x.id===no)){S.history.unshift({id:no,part:sk.label,mat:sk.mat,mode:"正式",amount:c.total,status:"已确认",date:"11-20 "+new Date().toTimeString().slice(0,5),actual:null,mods:(c.mods||[]).map(m=>({who:"戢祥毅",what:m.what,when:"刚刚"}))});save();}
    toast("已存入历史（不可覆盖，修改将生成新版本）");location.hash="#/history";};
  acts.append(b1,b2);w.appendChild(acts);
}

/* ================= 7 费率表 ================= */
function vRates(w){
  w.appendChild(pageHead("费率表","RATE TABLE","六大类参数 · 预置推荐值全部可改 · 保存生成新版本，历史报价锁定旧版本不受影响。当前版本 v"+rates().version));
  const grid=h("div","rates-grid");let editing=false;
  const defs=[
    ["材料库", [["6061 单价","28.5 元/kg（市场参考价）"],["6061 密度","2.70 g/cm3"],["45钢 单价","6.5 元/kg（市场参考价）"],["304 单价","18 元/kg（市场参考价）"]]],
    ["设备费率",[["三轴数控铣小时费率","80 元/h（市场参考价·行业访谈）"],["人工费率","60 元/h"]]],
    ["工时规则",[["毛坯单边余量","2 mm"],["铝件去除率","25 cm3/min"],["准备工时","0.5 h"],["孔附加","0.08 h/孔"]]],
    ["刀具摊销",[["铝件","10 元/h"],["钢件","18 元/h"]]],
    ["利润规则",[["默认利润率","20%"],["难度上浮","人工按单调整"]]],
    ["探价规则",[["区间宽度","±20%"],["口径","上浮后费率，与底价独立"]]],
  ];
  // 主要可编辑参数渲染
  const main=h("div","panel");main.style.marginBottom="16px";
  main.appendChild(h("h3",null,icon("sliders")+"核心参数（可编辑，保存生成新版本 v"+(rates().version+1)+"）"));
  const rows=[["machineRate","三轴数控铣小时费率（元/h，市场参考价）"],["laborRate","人工费率（元/h）"],["marginMM","毛坯单边余量（mm）"],["prepH","准备工时（h）"],["holeMin","孔附加工时（h/孔）"],["profit","默认利润率（小数，如 0.2）"],["probeBand","探价区间宽度（小数，如 0.2）"],["lossRate","材料损耗率（小数，如 0.05）"]];
  rows.forEach(([k,label])=>{
    const r=h("div","rate-row");r.innerHTML=`<span class="rn">${label}</span>`;
    const inp=h("input");inp.value=rates()[k];inp.disabled=editing;r.appendChild(inp);inp.dataset.key=k;
    r.appendChild(h("span","rs","v"+rates().version));main.appendChild(r);
  });
  const b=h("button","btn sm","保存为新版本");b.style.marginTop="14px";
  b.onclick=()=>{main.querySelectorAll("input").forEach(inp=>{const k=inp.dataset.key;if(k)rates()[k]=parseFloat(inp.value)||rates()[k];});
    rates().version++;save();toast("已生成参数版本 v"+rates().version+"，历史报价不受影响");route();};
  main.appendChild(b);w.appendChild(main);
  defs.forEach(([g,items])=>{
    const gd=h("div","rate-group");gd.appendChild(h("h4",null,icon("chevron-right")+g));
    items.forEach(([n,v])=>{const r=h("div","rate-row");r.innerHTML=`<span class="rn">${n}</span><span class="rv">${v}</span>`;gd.appendChild(r);});
    grid.appendChild(gd);
  });
  w.appendChild(grid);
}

/* ================= 8 历史报价 ================= */
function vHistory(w){
  w.appendChild(pageHead("历史报价","HISTORY","不可覆盖，修改生成新版本 · 可补录实际成本反哺费率 · 支持复制旧单为新报价。"));
  const sb=h("div","searchbar");
  const inp=h("input");inp.placeholder="按报价编号或零件名搜索，如：QT-20261118-003 或 法兰盘";
  sb.appendChild(inp);w.appendChild(sb);
  let kw="";
  inp.oninput=()=>{kw=inp.value.trim();drawList();};
  const listBox=h("div");w.appendChild(listBox);
  function drawList(){
    listBox.innerHTML="";
    const rows=S.history.filter(x=>!kw||x.id.includes(kw)||x.part.includes(kw))
      .map(x=>[x.id,x.part,(x.mode==="正式"?'<span class="tagchip t-ok"><i></i>已确认</span>':'<span class="tagchip t-probe"><i></i>探价</span>'),x.amount+" 元",x.date,x.actual?'<span style="color:var(--ok)">已补录</span>':"—"]);
    listBox.appendChild(tbl(["编号","零件","模式/状态","金额","日期","实际成本"],rows,r=>{
      const item=S.history.find(x=>x.id===r[0]);CUR.viewTask=item;drawDetail();}));
  }
  function drawDetail(){
    listBox.innerHTML="";const x=CUR.viewTask;
    const d=h("div","detail-box");
    d.innerHTML=`<h3 style="font-size:16px;font-weight:800">${x.id} · ${x.part} <span class="basis">${MATERIALS[x.mat]?MATERIALS[x.mat].name:""}</span></h3>`;
    const acts=h("div");acts.style.cssText="display:flex;gap:10px;margin:12px 0;flex-wrap:wrap";
    const b1=h("button","btn sm steel","复制为新报价");b1.onclick=()=>{loadTaskByPart(x.part);location.hash="#/compare";toast("已带入零件信息，作为新报价参考");};
    acts.appendChild(b1);d.appendChild(acts);
    const tl=h("div","timeline");
    (x.mods||[]).forEach(m=>tl.appendChild(h("div","te","<b>"+m.who+"</b> 修改："+m.what+" · "+m.when)));
    if(!x.mods||!x.mods.length)tl.appendChild(h("div","te","无修改记录（首次生成即确认）"));
    d.appendChild(tl);
    if(x.actual){d.innerHTML+=`<div class="assume" style="margin-top:14px"><div class="ah">${icon("check-circle")}已补录实际成本</div>
      <div class="ar">实际工时 <b>${x.actual.hours} h</b> · 实际成本 <b>${x.actual.cost} 元</b>（预估 ${x.amount} 元）—— 差异将用于费率校准（人工采纳）</div></div>`;}
    else{
      const f=h("div","probe-in");f.style.marginTop="14px";
      f.innerHTML=`<label>补录实际工时（h）</label><input id="h-act" value=""><label>补录实际成本（元）</label><input id="c-act" value="">`;
      const b=h("button","btn sm","保存补录");b.style.marginTop="12px";
      b.onclick=()=>{x.actual={hours:parseFloat($("#h-act").value)||0,cost:parseFloat($("#c-act").value)||0};save();toast("已补录：数据将反哺费率校准（人工采纳制）");drawDetail();};
      f.appendChild(b);d.appendChild(f);
    }
    listBox.appendChild(d);lucide.createIcons();
  }
  drawList();
}
route();
</script>
</body>
</html>
